# Full supported-hardware configuration for the aap PDP-6 emulator.
# Four Type-555 DECtape transports are attached to one Type-551 control.
# Media and terminal paths are intentionally left unmounted so this file is
# host-independent and safe to install under /usr/local/share.

mkdev apr apr166
mkdev tty tty626
mkdev ptr ptr760
mkdev ptp ptp761
mkdev dc dc136
mkdev dt0 dt551
mkdev dx1 dx555
mkdev dx2 dx555
mkdev dx3 dx555
mkdev dx4 dx555
mkdev dis dis340
mkdev joy joy420
mkdev ojoy joy724
mkdev fmem fmem162 0
mkdev mem0 moby mem_0

connectdev dc dt0
connectdev dt0 dx1 1
connectdev dt0 dx2 2
connectdev dt0 dx3 3
connectdev dt0 dx4 4

connectio tty apr
connectio ptr apr
connectio ptp apr
connectio dc apr
connectio dt0 apr
connectio dis apr
connectio joy apr
connectio ojoy apr

connectmem fmem 0 apr -1
connectmem mem0 0 apr 0
